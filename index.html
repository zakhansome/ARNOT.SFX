<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Auto SFX Video Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <p class="loading-text" id="loadingText">Memproses...</p>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>🎬 AI Auto SFX</h1>
    <p>Deteksi transisi otomatis + penempatan SFX otomatis</p>
  </div>

  <div class="main-content">
    <div class="statistics" id="statistics" style="display:none;">
      <div class="stat-card"><div class="stat-icon">🔄</div><div class="stat-value" id="statTransitions">0</div><div class="stat-label">Transisi</div></div>
      <div class="stat-card"><div class="stat-icon">🔊</div><div class="stat-value" id="statSFX">0</div><div class="stat-label">SFX</div></div>
      <div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-value" id="statDuration">0s</div><div class="stat-label">Durasi</div></div>
    </div>

    <div class="upload-section">
      <div class="upload-box" id="videoUploadBox">
        <div class="upload-icon">🎥</div>
        <h3>Upload Video</h3>
        <p>MP4 / WebM</p>
        <div class="file-info" id="videoInfo"></div>
        <input type="file" id="videoInput" class="file-input" accept="video/*">
      </div>
      <div class="upload-box" id="sfxUploadBox">
        <div class="upload-icon">🔊</div>
        <h3>Upload SFX</h3>
        <p>MP3 / WAV / OGG (bisa banyak)</p>
        <div class="file-info" id="sfxInfo"></div>
        <input type="file" id="sfxInput" class="file-input" accept="audio/*" multiple>
      </div>
    </div>

    <div class="options-section">
      <h3>⚙️ Pengaturan</h3>
      <div class="detection-settings">
        <div class="setting-row">
          <label for="transitionSensitivity">Sensitivitas Deteksi:</label>
          <input type="range" id="transitionSensitivity" min="1" max="10" value="6">
          <span class="setting-value" id="sensitivityValue">6</span>
        </div>
        <div class="setting-row">
          <label for="sfxVolume">Volume SFX:</label>
          <input type="range" id="sfxVolume" min="0" max="100" value="80">
          <span class="setting-value" id="volumeValue">80%</span>
        </div>
      </div>
    </div>

    <button class="process-btn" id="processBtn" disabled>🚀 Proses Otomatis</button>
    <div class="alert" id="alertBox"></div>

    <div class="progress-section" id="progressSection">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <div class="preview-section" id="previewSection">
      <h3>📺 Hasil</h3>
      <div class="video-preview"><video id="videoPreview" controls></video></div>
      <div class="sfx-timeline">
        <h4>🎵 Timeline SFX:</h4>
        <div id="sfxList"></div>
      </div>
      <button class="download-btn" id="downloadVideoBtn">💾 Download Video</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
